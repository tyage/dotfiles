# use Ctrl-t
set-option -g prefix C-t
bind-key C-t send-prefix
unbind-key C-b

# key bind
set-window-option -g mode-keys vi

# mouse setting
set-option -g mouse on

# Let supported terminals synchronize the tmux selection with the system clipboard.
set-option -g set-clipboard on

# sync tmux buffer on pbcopy/pbpaste
# Prefix + Ctrl-c/v
if-shell 'command -v pbcopy >/dev/null 2>&1' 'bind-key C-c run-shell "tmux save-buffer - | pbcopy"'
if-shell 'command -v pbpaste >/dev/null 2>&1' 'bind-key C-v run-shell "pbpaste | tmux load-buffer - && tmux paste-buffer"'
